<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">redstone.md organization banner</title>
  <desc id="desc">Updated modern technical banner for redstone.md with logo moved left and texts repositioned for perfect balance.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090B"/>
      <stop offset="0.6" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="brandText" x1="160" y1="120" x2="460" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FAFB"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    
    <linearGradient id="crystalTop" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="crystalLeft" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#DC2626"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="crystalRight" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>

    <linearGradient id="cardBorder1" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#00ADD8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00ADD8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardBorder2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#3178C6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3178C6" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="318" rx="19" stroke="#334155" stroke-opacity="0.5"/>

  <circle cx="200" cy="160" r="140" fill="#DC2626" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="1000" cy="160" r="180" fill="#EA580C" opacity="0.1" filter="url(#softGlow)"/>

  <g transform="translate(40, 0)">
    <g transform="translate(0, 115) scale(1.1)">
      <polygon points="40,15 80,-5 120,15 120,55 80,75 40,55" fill="#EF4444" opacity="0.2" filter="url(#glow)"/>
      <polygon points="80,-10 115,10 80,30 45,10" fill="url(#crystalTop)"/>
      <polygon points="45,10 80,30 80,70 45,50" fill="url(#crystalLeft)"/>
      <polygon points="115,10 80,30 80,70 115,50" fill="url(#crystalRight)"/>
    </g>

    <text x="160" y="150" fill="url(#brandText)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">redstone.md</text>
    <text x="162" y="195" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
      AI-native infrastructure &amp; reverse-engineering tooling.
    </text>
    <text x="162" y="228" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Shipping the stable edge in public. Building the deeper stack in private.
    </text>

    <circle cx="162" cy="265" r="4" fill="#10B981"/>
    <text x="176" y="270" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Local-first</text>
    
    <circle cx="270" cy="265" r="4" fill="#3B82F6"/>
    <text x="284" y="270" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Protocol-aware</text>
    
    <circle cx="410" cy="265" r="4" fill="#8B5CF6"/>
    <text x="424" y="270" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Operator-focused</text>
  </g>

  <g transform="translate(850, 48)">
    <text x="0" y="0" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" text-transform="uppercase">Public Edge Run-times</text>
    
    <g transform="translate(0, 20)">
      <rect width="390" height="92" rx="14" fill="#1E293B" fill-opacity="0.6" stroke="#334155"/>
      <rect width="390" height="2" rx="1" fill="url(#cardBorder1)"/>
      
      <text x="24" y="38" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Agentium</text>
      
      <rect x="135" y="18" width="38" height="24" rx="6" fill="#00ADD8" fill-opacity="0.1" stroke="#00ADD8" stroke-opacity="0.4"/>
      <text x="144" y="34" fill="#00ADD8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Go</text>

      <text x="24" y="64" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
        AI-native browser engine driving Chromium
      </text>
      <text x="24" y="84" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
        through CDP, exposing REST and MCP tools.
      </text>
    </g>

    <g transform="translate(0, 130)">
      <rect width="390" height="92" rx="14" fill="#1E293B" fill-opacity="0.6" stroke="#334155"/>
      <rect width="390" height="2" rx="1" fill="url(#cardBorder2)"/>
      
      <text x="24" y="38" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Mapr</text>
      
      <rect x="90" y="18" width="34" height="24" rx="6" fill="#3178C6" fill-opacity="0.1" stroke="#3178C6" stroke-opacity="0.4"/>
      <text x="99" y="34" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">TS</text>

      <rect x="132" y="18" width="42" height="24" rx="6" fill="#F4F4F5" fill-opacity="0.1" stroke="#F4F4F5" stroke-opacity="0.3"/>
      <text x="141" y="34" fill="#F4F4F5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Bun</text>

      <text x="24" y="64" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
        Bun-native CLI/TUI for deep frontend reverse
      </text>
      <text x="24" y="84" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">
        engineering, artifacts collection, and AI.
      </text>
    </g>
  </g>
</svg>
